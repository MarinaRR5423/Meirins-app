<!-- Subject sugerido: Tu código de verificación -->
<body style="margin:0;padding:0;background-color:#F5F5F5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F5F5;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#FFFFFF;border-radius:20px;">
          <tr>
            <td style="padding:36px 32px 0 32px;text-align:center;">
              <img src="https://blummapp.com/blumm-logo.png" alt="Blumm" width="110" style="display:block;margin:0 auto;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px 32px;">
              <h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:800;color:#0A0A0A;text-align:center;">Verifica tu identidad</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 28px 32px;">
              <p style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;line-height:22px;color:#525252;text-align:center;">Usa este código para confirmar una acción sensible en tu cuenta. Caduca en unos minutos.</p>
            </td>
          </tr>
        <tr>
          <td style="padding:0 32px 8px 32px;text-align:center;">
            <div style="display:inline-block;background-color:#F5F5F5;border-radius:12px;padding:18px 36px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:30px;font-weight:700;letter-spacing:8px;color:#0A0A0A;">{{ .Token }}</div>
          </td>
        </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
          <tr>
            <td style="padding:24px 32px 0 32px;text-align:center;">
              <p style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;color:#A3A3A3;">Si no has solicitado esto, ignora este email.<br>Blumm · <a href="https://blummapp.com" style="color:#A3A3A3;">blummapp.com</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
