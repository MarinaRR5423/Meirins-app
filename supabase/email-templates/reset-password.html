    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#FFFFFF;border-radius:20px;">
          <tr>
            <td style="padding:36px 32px 0 32px;text-align:center;">
              <img src="https://blummapp.com/blumm-logo.png" alt="Blumm" width="110" style="display:block;margin:0 auto;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px 32px;">
              <h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:800;color:#0A0A0A;text-align:center;">Restablece tu contraseña</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 28px 32px;">
              <p style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;line-height:22px;color:#525252;text-align:center;">Hemos recibido una solicitud para restablecer tu contraseña. Si no has sido tú, puedes ignorar este email.</p>
            </td>
          </tr>
        <tr>
          <td style="padding:0 32px 24px 32px;text-align:center;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#FE6004;color:#FFFFFF;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;font-weight:700;text-decoration:none;padding:14px 34px;border-radius:999px;">Restablecer contraseña</a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 32px 32px;">
            <p style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;line-height:16px;color:#A3A3A3;text-align:center;">Si el botón no funciona, copia y pega este enlace:<br><a href="{{ .ConfirmationURL }}" style="color:#429FE7;word-break:break-all;">{{ .ConfirmationURL }}</a></p>
          </td>
        </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
          <tr>
            <td style="padding:24px 32px 0 32px;text-align:center;">
              <p style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;color:#A3A3A3;">Blumm · <a href="https://blummapp.com" style="color:#A3A3A3;">blummapp.com</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
